<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>留学OTA TikTok動画（15秒）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --page: #EEF1F6;
    --panel: #FFFFFF;
    --text: #152238;
    --muted: #5B6779;
    --line: #D5DCE6;
    --accent: #1E56C8;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --page: #10151F;
      --panel: #1A2230;
      --text: #E8EDF5;
      --muted: #A3AEBF;
      --line: #2C3748;
      --accent: #7EA6F2;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--text);
    font-family: "M PLUS Rounded 1c", "Hiragino Maru Gothic ProN", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px;
  }
  #viewport { position: relative; overflow: hidden; border-radius: 18px; box-shadow: 0 10px 30px rgba(0,0,0,.18); background: #000; }
  #stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; transform-origin: 0 0; overflow: hidden; background: #fff; }

  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .scene .bgimg { position: absolute; left: 0; width: 1080px; display: block; }
  .scene .fade { position: absolute; left: 0; width: 1080px; height: 160px; }

  /* テロップ：上3分の1、太く大きく、最大2行。右端は空ける */
  .telop { position: absolute; left: 64px; top: 230px; width: 880px; z-index: 5; }
  .telop .line {
    display: block; width: max-content; white-space: nowrap; font-weight: 900; line-height: 1.22; letter-spacing: .01em;
    color: #FFFFFF; -webkit-text-stroke: 20px #152238; paint-order: stroke fill;
    filter: drop-shadow(0 8px 0 rgba(21,34,56,.22));
  }
  .telop.dark .line { color: #152238; -webkit-text-stroke: 20px #FFFFFF; filter: drop-shadow(0 8px 0 rgba(21,34,56,.12)); }

  /* アプリ画面（プロトタイプの見た目を再現） */
  .app { position: absolute; width: 390px; background: #F7F9FC; color: #152238; overflow: hidden; font-family: inherit; }
  .app-status { height: 40px; display: flex; align-items: center; justify-content: space-between; padding: 0 26px; font-size: 15px; font-weight: 800; background: #fff; }
  .app-sys { display: flex; gap: 5px; align-items: center; }
  .app-sys i { width: 16px; height: 10px; border-radius: 2px; background: #152238; display: block; }
  .app-sys b { width: 24px; height: 11px; border-radius: 3px; border: 2px solid #152238; display: block; }
  .app-head { background: #fff; padding: 4px 18px 6px; font-size: 15px; font-weight: 900; display: flex; align-items: center; gap: 6px; }
  .app-journey { background: #fff; padding: 4px 18px 12px; display: flex; align-items: flex-end; gap: 14px; border-bottom: 1px solid #E3E8EF; }
  .app-journey small { display: block; font-size: 11px; color: #64748B; }
  .app-journey .num { font-size: 13px; font-weight: 800; white-space: nowrap; }
  .app-journey .num strong { font-size: 30px; font-weight: 900; color: #1E56C8; margin: 0 2px; }
  .app-dots { flex: 1; display: flex; align-items: center; padding-bottom: 10px; }
  .app-dots .seg { height: 2px; flex: 1; background: #D7DEE8; }
  .app-dots .seg.done { background: #17A673; }
  .app-dots .d { width: 10px; height: 10px; border-radius: 50%; border: 2px solid #CBD5E1; background: #fff; flex: none; }
  .app-dots .d.done { width: 14px; height: 14px; border: 0; background: #17A673; }
  .app-dots .d.now { width: 24px; height: 24px; border: 0; background: #1E56C8; box-shadow: 0 0 0 4px #DBEAFE; display: flex; align-items: center; justify-content: center; }
  .app-dots .d.now svg { width: 13px; height: 13px; }
  .app-search { margin: 12px 14px 0; height: 42px; border-radius: 14px; background: #fff; border: 1px solid #CBD5E1; display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 14px; font-weight: 700; }
  .app-chip { display: inline-block; background: #152238; color: #fff; border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 800; }
  .app-meta { display: flex; justify-content: space-between; align-items: center; margin: 10px 16px 6px; font-size: 13px; }
  .app-meta span { color: #64748B; font-size: 12px; }
  .app-card { margin: 8px 14px; background: #fff; border-radius: 22px; padding: 12px 14px; box-shadow: 0 1px 3px rgba(21,34,56,.08); border: 1px solid #EEF2F7; }
  .app-card-top { display: flex; justify-content: space-between; font-size: 11px; color: #64748B; }
  .app-card-top .star { color: #152238; font-weight: 800; }
  .app-name { font-size: 15px; font-weight: 900; margin-top: 2px; }
  .app-course { font-size: 12px; margin-top: 2px; }
  .app-label { font-size: 11px; color: #64748B; margin-top: 8px; }
  .app-price { font-size: 26px; font-weight: 900; letter-spacing: -.01em; line-height: 1.15; }
  .app-price mark { background: linear-gradient(transparent 55%, #FFE27A 55%); color: inherit; padding: 0 2px; }
  .app-break { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; font-size: 10.5px; color: #64748B; margin-top: 6px; }
  .app-break b { color: #152238; font-weight: 800; }
  .app-tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; background: #fff; border-top: 1px solid #E3E8EF; display: grid; grid-template-columns: repeat(5, 1fr); font-size: 10px; font-weight: 800; color: #7A8699; }
  .app-tabs span { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .app-tabs span.on { color: #1E56C8; }
  .app-tabs i { width: 18px; height: 18px; border-radius: 6px; border: 2px solid currentColor; display: block; }
  .app-total { margin: 10px 14px; background: #fff; border-radius: 22px; padding: 14px; border: 1px solid #EEF2F7; box-shadow: 0 1px 3px rgba(21,34,56,.08); }
  .app-total .big { font-size: 34px; font-weight: 900; line-height: 1.1; margin-top: 2px; }
  .app-bar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; margin-top: 10px; }
  .app-rows { margin-top: 10px; font-size: 12.5px; }
  .app-rows div { display: flex; justify-content: space-between; padding: 3px 0; }
  .app-rows dt { display: flex; align-items: center; gap: 6px; color: #475569; margin: 0; }
  .app-rows dt i { width: 9px; height: 9px; border-radius: 2px; display: block; }
  .app-rows dd { margin: 0; font-weight: 800; }
  .app-cta { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid #E3E8EF; padding: 10px 14px 16px; display: flex; gap: 8px; }
  .app-cta span { height: 46px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 14px; }
  .app-cta .ghost { border: 1px solid #CBD5E1; padding: 0 14px; }
  .app-cta .main { flex: 1; background: #1E56C8; color: #fff; }

  .device { position: absolute; border-radius: 64px; border: 16px solid #152238; background: #152238; box-shadow: 0 30px 60px rgba(21,34,56,.28); overflow: hidden; }
  .device .app { position: relative; border-radius: 48px; }

  /* TikTokで隠れる範囲 */
  #safe { position: absolute; inset: 0; z-index: 50; pointer-events: none; display: none; }
  #safe div { position: absolute; background: rgba(240,86,122,.28); border: 3px dashed rgba(240,86,122,.9); color: #fff; font: 800 30px/1.3 "M PLUS Rounded 1c", sans-serif; padding: 12px; text-shadow: 0 2px 4px rgba(0,0,0,.4); }

  /* 操作パネル */
  .controls { width: 100%; display: flex; flex-direction: column; gap: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .btn { height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: 800 14px/1 inherit; font-family: inherit; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: transparent; color: #fff; }
  .btn svg { width: 18px; height: 18px; }
  .btn:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #seek { flex: 1; accent-color: var(--accent); height: 44px; }
  #time { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 84px; text-align: right; }
  label.safe { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin-left: auto; cursor: pointer; }
  #scenelabel { font-size: 13px; color: var(--muted); }
</style>
</head>

        <div class="telop"><span class="line">留学OTAなら</span><span class="line">航空券込みの総額で比較</span></div>
      </section>

      <!-- 場面5：行動の呼びかけ 12〜15秒 -->
      <section class="scene" data-start="12" data-end="15" data-enter="slide" data-name="行動の呼びかけ" style="background:#1E56C8">
        <div class="device" id="deviceDetail" style="left:330px;top:640px;border-color:#fff;background:#fff;transform-origin:0 0;transform:scale(1.0)"></div>
        <div class="telop" data-max="150"><span class="line">学生無料！</span><span class="line">プロフィールからチェック</span></div>
      </section>

      <div id="safe" aria-hidden="true">
        <div style="left:0;right:0;top:0;height:180px">上：タブ表示</div>
        <div style="right:0;top:760px;width:170px;height:776px;font-size:24px">右：ボタン</div>
        <div style="left:0;right:0;bottom:0;height:384px">下5分の1：キャプション</div>
      </div>
    </div>
  </div>

  <div class="controls" role="group" aria-label="再生の操作">
    <div class="row">
      <button class="btn primary" id="play" aria-label="再生"></button>
      <button class="btn" id="restart" aria-label="最初から再生">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 3v6h6"/></svg>最初から
      </button>
      <input id="seek" type="range" min="0" max="15" step="0.01" value="0" aria-label="再生位置">
      <span id="time">0.0 / 15.0秒</span>
    </div>
    <div class="row">
      <span id="scenelabel">場面：課題</span>
      <label class="safe"><input type="checkbox" id="safeToggle">TikTokで隠れる範囲を表示</label>
    </div>
  </div>

<script>
(() => {
  const DURATION = 15, SLIDE = 0.3;
  const PLANE = '<svg viewBox="0 0 24 24" fill="#fff"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg>';

  function dots(reached) {
    let h = "";
    for (let i = 0; i < 8; i++) {
      if (i > 0) h += `<span class="seg${i <= reached ? " done" : ""}"></span>`;
      h += i < reached ? '<span class="d done"></span>' : i === reached ? `<span class="d now">${PLANE}</span>` : '<span class="d"></span>';
    }
    return h;
  }
  function journey(reached) {
    return `<div class="app-journey"><div><small>渡航まで</small><div class="num">あと<strong>${8 - reached}</strong>ステップ</div></div><div class="app-dots">${dots(reached)}</div></div>`;
  }
  const status = '<div class="app-status"><span>9:41</span><span class="app-sys"><i></i><i></i><b></b></span></div>';
  const tabs = (on) => `<div class="app-tabs">${["ホーム","さがす","くらべる","お気に入り","マイ留学"].map((t, i) => `<span class="${i === on ? "on" : ""}"><i></i>${t}</span>`).join("")}</div>`;

  const PLANS = [
    { place: "🇵🇭 フィリピン　バギオ", star: "4.4", name: "バギオ・ハイランド英語学院", course: "スパルタ集中・4週間", total: "305,000円", b: ["14万円", "6万円", "3.5万円", "7万円"] },
    { place: "🇵🇭 フィリピン　セブ", star: "4.5", name: "セブ・オーシャン語学アカデミー", course: "マンツーマン集中・4週間", total: "325,000円", b: ["15万円", "7万円", "3.5万円", "7万円"] },
    { place: "🇵🇭 フィリピン　クラーク", star: "4.3", name: "クラーク・ブリッジ英語学校", course: "ビジネス英語・4週間", total: "360,000円", b: ["17万円", "8.5万円", "3.5万円", "7万円"] },
  ];
  function results(height, highlight) {
    const cards = PLANS.map((p) => `
      <div class="app-card">
        <div class="app-card-top"><span>${p.place}</span><span class="star">★${p.star}</span></div>
        <div class="app-name">${p.name}</div>
        <div class="app-course">${p.course}</div>
        <div class="app-label">総額の目安（航空券込み）</div>
        <div class="app-price">${highlight ? `<mark>${p.total}</mark>` : p.total}</div>
        <div class="app-break"><span>学費<br><b>${p.b[0]}</b></span><span>滞在費<br><b>${p.b[1]}</b></span><span>諸費用<br><b>${p.b[2]}</b></span><span>航空券<br><b>${p.b[3]}</b></span></div>
      </div>`).join("");
    return `<div class="app" style="height:${height}px">${status}<div class="app-head">留学OTA</div>${journey(1)}
      <div class="app-search">🔍 フィリピン　4週間　<span class="app-chip">50万円以内</span></div>
      <div class="app-meta"><div><b>3件</b>のプラン</div><span>総額が安い順</span></div>${cards}${tabs(1)}</div>`;
  }
  function detail(height) {
    const parts = [["学費", "150,000円", "#1E56C8", 150], ["滞在費（学内寮・3食付き）", "70,000円", "#5B8DEF", 70], ["諸費用（入学金など）", "35,000円", "#9DB8F2", 35], ["航空券（成田発往復の目安）", "70,000円", "#17A673", 70]];
    return `<div class="app" style="height:${height}px">${status}<div class="app-head">‹ 戻る</div>${journey(3)}
      <div style="padding:12px 18px 0"><div style="font-size:11px;color:#64748B">語学留学　🇵🇭 フィリピン　セブ</div>
      <div style="font-size:19px;font-weight:900;margin-top:2px">セブ・オーシャン語学アカデミー</div>
      <div style="font-size:12px;margin-top:2px">マンツーマン集中・4週間　★4.5</div></div>
      <div class="app-total"><div style="font-size:11px;color:#64748B">総額の目安（航空券込み）</div><div class="big">325,000円</div>
        <div class="app-bar">${parts.map((p) => `<span style="flex:${p[3]};background:${p[2]}"></span>`).join("")}</div>
        <dl class="app-rows">${parts.map((p) => `<div><dt><i style="background:${p[2]}"></i>${p[0]}</dt><dd>${p[1]}</dd></div>`).join("")}</dl>
        <div style="font-size:10.5px;color:#64748B;margin-top:6px">このサイトの利用に追加の手数料はかかりません。</div></div>
      <div style="margin:0 14px;padding:10px 12px;border-radius:16px;background:#EAF7F1;font-size:12px;line-height:1.5"><b>契約とビザは専門家がオンラインで一緒に</b><br>難しい手続きは、ひとりでやらなくて大丈夫。</div>
      <div class="app-cta"><span class="ghost">AIに質問</span><span class="main">このプランで申し込む</span></div></div>`;
  }

  document.getElementById("phoneInlay").innerHTML = results(760, false).replace('class="app"', 'class="app" style="position:absolute;left:0;top:0;height:760px"');
  document.getElementById("deviceResults").innerHTML = results(720, true).replace('class="app" style="height:720px"', 'class="app" style="height:720px;width:390px"');
  document.getElementById("deviceDetail").innerHTML = detail(720);
  // 端末の大きさ（下5分の1に入らないように調整）
  const fitDevice = (id, top, maxBottom) => {
    const el = document.getElementById(id);
    const outerW = 390 + 32, outerH = 720 + 32;
    const s = Math.min(1.3, (maxBottom - top) / outerH);
    el.style.transform = `scale(${s})`;
    el.style.left = `${Math.max(64, (1080 - outerW * s) / 2 - 50)}px`;
    el.style.top = `${top}px`;
  };
  fitDevice("deviceResults", 590, 1525);
  fitDevice("deviceDetail", 590, 1525);

  // テロップを1行ずつ幅に合わせて大きく
  function fitTelops() {
    document.querySelectorAll(".telop").forEach((t) => {
      const max = Number(t.dataset.max || 112);
      t.querySelectorAll(".line").forEach((line) => {
        line.style.fontSize = "100px";
        const w = line.getBoundingClientRect().width / currentScale();
        line.style.fontSize = `${Math.min(max, Math.floor((100 * 860) / w))}px`;
      });
    });
  }

  // 再生まわり
  const stage = document.getElementById("stage");
  const viewport = document.getElementById("viewport");
  const scenes = [...document.querySelectorAll(".scene")];
  const playBtn = document.getElementById("play");
  const seek = document.getElementById("seek");
  const timeEl = document.getElementById("time");
  const sceneLabel = document.getElementById("scenelabel");
  let t = 0, playing = false, last = 0, scale = 1;

  function currentScale() { return scale; }
  function layout() {
    const controlsH = document.querySelector(".controls").offsetHeight + 36;
    const w = Math.min(window.innerWidth - 24, 520);
    scale = Math.min(w / 1080, (window.innerHeight - controlsH) / 1920);
    viewport.style.width = `${1080 * scale}px`;
    viewport.style.height = `${1920 * scale}px`;
    stage.style.transform = `scale(${scale})`;
    document.querySelector(".controls").style.width = `${Math.max(1080 * scale, 320)}px`;
  }
  const ease = (p) => 1 - Math.pow(1 - p, 3);

  function render() {
    let idx = scenes.findIndex((s) => t >= +s.dataset.start && t < +s.dataset.end);
    if (idx < 0) idx = scenes.length - 1;
    const cur = scenes[idx];
    const p = (t - +cur.dataset.start) / SLIDE;
    const sliding = cur.dataset.enter === "slide" && p < 1 && idx > 0;
    scenes.forEach((s, i) => {
      s.style.display = i === idx || (sliding && i === idx - 1) ? "block" : "none";
      s.style.zIndex = i === idx ? 2 : 1;
      s.style.transform = "none";
    });
    if (sliding) cur.style.transform = `translateX(${(1 - ease(Math.max(0, p))) * 1080}px)`;
    seek.value = t.toFixed(2);
    timeEl.textContent = `${t.toFixed(1)} / ${DURATION.toFixed(1)}秒`;
    sceneLabel.textContent = `場面：${cur.dataset.name}（${cur.dataset.start}〜${cur.dataset.end}秒）`;
  }
  function setPlaying(v) {
    playing = v;
    playBtn.innerHTML = v
      ? '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>一時停止'
      : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></svg>再生';
    playBtn.setAttribute("aria-label", v ? "一時停止" : "再生");
    if (v) { last = performance.now(); requestAnimationFrame(tick); }
  }
  function tick(now) {
    if (!playing) return;
    t = Math.min(DURATION, t + (now - last) / 1000);
    last = now;
    render();
    if (t >= DURATION) { setPlaying(false); return; }
    requestAnimationFrame(tick);
  }

  playBtn.addEventListener("click", () => {
    if (!playing && t >= DURATION) t = 0;
    setPlaying(!playing);
  });
  document.getElementById("restart").addEventListener("click", () => { t = 0; render(); setPlaying(true); });
  seek.addEventListener("input", () => { t = Number(seek.value); render(); });
  document.getElementById("safeToggle").addEventListener("change", (e) => {
    document.getElementById("safe").style.display = e.target.checked ? "block" : "none";
  });
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space" && e.target === document.body) { e.preventDefault(); playBtn.click(); }
  });
  window.addEventListener("resize", () => { layout(); });

  layout();
  setPlaying(false);
  render();
  const ready = document.fonts ? document.fonts.ready : Promise.resolve();
  ready.then(() => {
    // 計測のため一時的に全場面を表示
    scenes.forEach((s) => (s.style.display = "block"));
    fitTelops();
    render();
  });
})();
</script>
</body>
</html>
